name: Build ALAM Number Lookup APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ALAM_Number_Lookup.zip'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project ZIP
        run: |
          mkdir -p /tmp/alam-project
          unzip -o ALAM_Number_Lookup.zip -d /tmp/alam-project
          cp -a /tmp/alam-project/. .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ALAM-Number-Lookup-APK
          path: app/build/outputs/apk/debug/app-debug.apk
